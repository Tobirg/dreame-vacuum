name: Local AVA adapter tests

on:
  push:
    branches:
      - feat/local-ava-transport
  workflow_dispatch:

jobs:
  local-ava-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install transport dependency
        run: python -m pip install requests
      - name: Check Python syntax
        run: python -m compileall -q custom_components/dreame_vacuum/dreame/local_ava.py custom_components/dreame_vacuum/dreame/protocol.py custom_components/dreame_vacuum/config_flow.py
      - name: Run offline adapter tests
        run: python -m unittest discover -s tests -p 'test_local_ava.py' -v
